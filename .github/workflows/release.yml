name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DK-AerialView.sln

      - name: Publish win-x64
        run: dotnet publish src/DKAerialView/DKAerialView.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/win-x64 -p:DebugType=None -p:DebugSymbols=false

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath "DK-AerialView-${{ github.ref_name }}-win-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DK-AerialView-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
