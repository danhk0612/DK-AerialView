name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate application icon
        shell: pwsh
        run: ./tools/Generate-AppIcon.ps1

      - name: Restore
        run: dotnet restore DK-AerialView.sln

      - name: Build
        run: dotnet build DK-AerialView.sln --configuration Release --no-restore

      - name: Restore win-x64 runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet restore src/DKAerialView/DKAerialView.csproj --runtime win-x64

      - name: Publish win-x64
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/DKAerialView/DKAerialView.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/win-x64 --no-restore -p:DebugType=None -p:DebugSymbols=false

      - name: Include user documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Copy-Item README.md publish/win-x64/README.md -Force
          Copy-Item LICENSE publish/win-x64/LICENSE -Force

      - name: Read project version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/DKAerialView/DKAerialView.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Project Version is missing.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      - name: Package win-x64 ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zip = "publish/DK-AerialView-v$version-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path publish/win-x64/* -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"

      - name: Upload win-x64 artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: DK-AerialView-v${{ steps.version.outputs.version }}-win-x64
          path: publish/DK-AerialView-v${{ steps.version.outputs.version }}-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release when version is new
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $zip = "publish/DK-AerialView-$tag-win-x64.zip"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Skipping duplicate release."
            exit 0
          }

          gh release create $tag $zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "DK AerialView $tag" `
            --generate-notes
