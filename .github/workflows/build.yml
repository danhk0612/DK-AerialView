name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate application icon
        shell: pwsh
        run: ./tools/Generate-AppIcon.ps1

      - name: Restore
        run: dotnet restore DK-AerialView.sln

      - name: Build
        run: dotnet build DK-AerialView.sln --configuration Release --no-restore

      - name: Publish framework-dependent app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/DKAerialView/DKAerialView.csproj --configuration Release --output publish/app --no-restore -p:DebugType=None -p:DebugSymbols=false

      - name: Publish native launcher
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/DKAerialView.Launcher/DKAerialView.Launcher.csproj --configuration Release --output publish/launcher --no-restore -p:DebugType=None -p:DebugSymbols=false

      - name: Assemble portable package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $package = "publish/package"
          $app = Join-Path $package "app"

          Remove-Item $package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $app -Force | Out-Null

          Copy-Item "publish/launcher/DK-AerialView.exe" (Join-Path $package "DK-AerialView.exe") -Force
          Copy-Item "publish/app/*" $app -Recurse -Force
          Copy-Item README.md (Join-Path $package "README.md") -Force
          Copy-Item LICENSE (Join-Path $package "LICENSE") -Force

          $required = @(
            (Join-Path $package "DK-AerialView.exe"),
            (Join-Path $app "DK-AerialView.App.exe"),
            (Join-Path $app "Assets/MapHost/index.html"),
            (Join-Path $app "Assets/RoadviewHost/index.html")
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required package file is missing: $path" }
          }

          $runtimeFiles = Get-ChildItem $package -Recurse -File | Where-Object {
            $_.Name -in @("coreclr.dll", "hostfxr.dll", "System.Private.CoreLib.dll")
          }
          if ($runtimeFiles) {
            throw "Framework-dependent package unexpectedly contains .NET runtime files: $($runtimeFiles.FullName -join ', ')"
          }

          Write-Host "Package files:"
          Get-ChildItem $package -Recurse -File | ForEach-Object {
            Write-Host ("{0,10:N0}  {1}" -f $_.Length, $_.FullName.Substring((Resolve-Path $package).Path.Length + 1))
          }

      - name: Read project version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/DKAerialView/DKAerialView.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Project Version is missing.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      - name: Package win-x64 ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zip = "publish/DK-AerialView-v$version-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path publish/package/* -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip ($((Get-Item $zip).Length) bytes)"

      - name: Upload win-x64 artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: DK-AerialView-v${{ steps.version.outputs.version }}-win-x64
          path: publish/DK-AerialView-v${{ steps.version.outputs.version }}-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release when version is new
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $zip = "publish/DK-AerialView-$tag-win-x64.zip"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Skipping duplicate release."
            exit 0
          }

          if ($version.Contains("-")) {
            gh release create $tag $zip `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "DK AerialView $tag" `
              --generate-notes `
              --prerelease
          }
          else {
            gh release create $tag $zip `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "DK AerialView $tag" `
              --generate-notes
          }
