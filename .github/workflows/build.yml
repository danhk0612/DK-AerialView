name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DK-AerialView.sln

      - name: Build
        run: dotnet build DK-AerialView.sln --configuration Release --no-restore

      - name: Publish win-x64 test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/DKAerialView/DKAerialView.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/win-x64 --no-restore -p:DebugType=None -p:DebugSymbols=false

      - name: Upload win-x64 artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: DK-AerialView-win-x64
          path: publish/win-x64
          if-no-files-found: error
          retention-days: 14
