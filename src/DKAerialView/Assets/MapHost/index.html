<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html, body, #map { width:100%; height:100%; margin:0; overflow:hidden; background:#eceff1; }
    #message { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:14px sans-serif; color:#555; pointer-events:none; z-index:20; text-align:center; padding:24px; box-sizing:border-box; }
    #frame {
      position:absolute;
      left:50%; top:50%;
      transform:translate(-50%,-50%);
      border:2px solid rgba(255,255,255,.95);
      box-shadow:0 0 0 9999px rgba(0,0,0,.32), 0 0 0 1px rgba(0,0,0,.45) inset;
      pointer-events:none;
      z-index:10;
      display:none;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="frame"></div>
  <div id="message">지도 초기화 대기 중</div>
  <script>
    let map = null;
    let geocoder = null;
    let provider = null;
    let suppressCameraMessage = false;
    let frameWidth = 16;
    let frameHeight = 9;

    const post = payload => window.chrome.webview.postMessage(payload);
    const message = text => document.getElementById('message').textContent = text || '';
    const mapNode = () => document.getElementById('map');
    const currentOrigin = () => window.location.origin;

    window.gm_authFailure = () => {
      const detail = `Google Maps 인증 실패. Maps JavaScript API 활성화, Billing 연결, API Key의 HTTP referrer 허용에 ${currentOrigin()} 를 등록했는지 확인하세요.`;
      message(detail);
      post({ type:'error', message:detail, provider:'google', origin:currentOrigin(), reason:'auth' });
    };

    function resetMapHost() {
      map = null;
      geocoder = null;
      mapNode().innerHTML = '';
      document.getElementById('frame').style.display = 'none';
      message('지도 초기화 중...');
    }

    function sdkLoadError() {
      let detail = `지도 SDK를 불러오지 못했습니다. (${provider})`;
      if (provider === 'kakao') {
        detail = `Kakao 지도 SDK를 불러오지 못했습니다. Kakao Developers의 JavaScript SDK 도메인에 ${currentOrigin()} 를 등록하고 JavaScript Key를 확인하세요.`;
      } else if (provider === 'google') {
        detail = `Google Maps SDK를 불러오지 못했습니다. 네트워크 상태와 API Key, Maps JavaScript API 활성화 여부를 확인하세요.`;
      }
      message(detail);
      post({ type:'error', message:detail, provider, origin:currentOrigin(), reason:'sdk-load' });
    }

    function loadScript(id, src, onload) {
      const previous = document.getElementById(id);
      if (previous) previous.remove();
      const script = document.createElement('script');
      script.id = id;
      script.async = true;
      script.defer = true;
      script.src = src;
      script.onload = onload || null;
      script.onerror = sdkLoadError;
      document.head.appendChild(script);
    }

    function finishReady(capabilities) {
      message('');
      resizeFrame();
      document.getElementById('frame').style.display = 'block';
      post({ type:'ready', provider, capabilities, origin:currentOrigin() });
      emitCamera();
    }

    function loadGoogle(apiKey) {
      if (!apiKey) return missingKey('Google Maps API Key');
      window.__initGoogleMap = () => {
        map = new google.maps.Map(mapNode(), {
          center: { lat:37.5665, lng:126.9780 },
          zoom:18,
          tilt:45,
          heading:315,
          mapTypeId:'satellite',
          mapId:'DEMO_MAP_ID',
          streetViewControl:false,
          mapTypeControl:true,
          fullscreenControl:false
        });
        geocoder = new google.maps.Geocoder();
        ['center_changed','zoom_changed','heading_changed','tilt_changed'].forEach(name => map.addListener(name, emitCamera));
        finishReady({ tilt:true, heading:true, geocode:true, satellite:true });
      };
      const src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&loading=async&callback=__initGoogleMap&v=weekly&language=ko&region=KR&auth_referrer_policy=origin`;
      loadScript('google-maps-script', src);
    }

    function loadNaver(clientId) {
      if (!clientId) return missingKey('Naver Maps Client ID');
      loadScript(
        'naver-maps-script',
        `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(clientId)}&submodules=geocoder`,
        () => {
          if (!window.naver || !naver.maps) {
            post({ type:'error', message:'Naver Maps SDK 초기화에 실패했습니다.' });
            return;
          }
          const create = () => {
            map = new naver.maps.Map(mapNode(), {
              center:new naver.maps.LatLng(37.5665,126.9780),
              zoom:18,
              mapTypeId:naver.maps.MapTypeId.SATELLITE,
              mapTypeControl:true
            });
            ['center_changed','zoom_changed'].forEach(name => naver.maps.Event.addListener(map, name, emitCamera));
            finishReady({ tilt:false, heading:false, geocode:true, satellite:true });
          };
          if (naver.maps.jsContentLoaded) create();
          else naver.maps.onJSContentLoaded = create;
        }
      );
    }

    function loadKakao(appKey) {
      if (!appKey) return missingKey('Kakao JavaScript Key');
      loadScript(
        'kakao-maps-script',
        `https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey=${encodeURIComponent(appKey)}&libraries=services`,
        () => {
          if (!window.kakao || !kakao.maps) {
            const detail = `Kakao Maps SDK 초기화에 실패했습니다. JavaScript SDK 도메인 ${currentOrigin()} 및 JavaScript Key를 확인하세요.`;
            message(detail);
            post({ type:'error', message:detail, provider:'kakao', origin:currentOrigin(), reason:'sdk-init' });
            return;
          }
          kakao.maps.load(() => {
            try {
              map = new kakao.maps.Map(mapNode(), {
                center:new kakao.maps.LatLng(37.5665,126.9780),
                level:4
              });
              map.setMapTypeId(kakao.maps.MapTypeId.SKYVIEW);
              geocoder = new kakao.maps.services.Geocoder();
              kakao.maps.event.addListener(map, 'center_changed', emitCamera);
              kakao.maps.event.addListener(map, 'zoom_changed', emitCamera);
              finishReady({ tilt:false, heading:false, geocode:true, satellite:true });
            } catch (error) {
              const detail = `Kakao 지도 초기화 실패: ${error?.message || error}`;
              message(detail);
              post({ type:'error', message:detail, provider:'kakao', origin:currentOrigin(), reason:'map-init' });
            }
          });
        }
      );
    }

    function missingKey(name) {
      message(`설정에서 ${name}를 입력하세요.`);
      post({ type:'error', message:`${name}가 설정되지 않았습니다.` });
    }

    function initialize(cmd) {
      provider = (cmd.provider || 'google').toLowerCase();
      resetMapHost();
      post({ type:'diagnostic', provider, origin:currentOrigin(), message:`${provider} 초기화 시작 (${currentOrigin()})` });
      if (provider === 'google') loadGoogle(cmd.googleApiKey || cmd.apiKey);
      else if (provider === 'naver') loadNaver(cmd.naverClientId);
      else if (provider === 'kakao') loadKakao(cmd.kakaoJavaScriptKey);
      else post({ type:'error', message:`지원하지 않는 지도 Provider입니다: ${provider}` });
    }

    function emitCamera() {
      if (!map || suppressCameraMessage) return;
      if (provider === 'google') {
        const center = map.getCenter();
        if (!center) return;
        post({ type:'cameraChanged', lat:center.lat(), lng:center.lng(), zoom:map.getZoom() ?? 18, tilt:map.getTilt() ?? 0, heading:map.getHeading() ?? 0 });
      } else if (provider === 'naver') {
        const center = map.getCenter();
        post({ type:'cameraChanged', lat:center.lat(), lng:center.lng(), zoom:map.getZoom(), tilt:0, heading:0 });
      } else if (provider === 'kakao') {
        const center = map.getCenter();
        post({ type:'cameraChanged', lat:center.getLat(), lng:center.getLng(), zoom:22-map.getLevel(), tilt:0, heading:0 });
      }
    }

    function setCamera(cmd) {
      if (!map) return;
      suppressCameraMessage = true;
      if (provider === 'google') {
        map.moveCamera({ center:{ lat:cmd.lat, lng:cmd.lng }, zoom:cmd.zoom, tilt:cmd.tilt, heading:cmd.heading });
      } else if (provider === 'naver') {
        map.setCenter(new naver.maps.LatLng(cmd.lat, cmd.lng));
        map.setZoom(Math.max(1, Math.min(21, Math.round(cmd.zoom))));
      } else if (provider === 'kakao') {
        map.setCenter(new kakao.maps.LatLng(cmd.lat, cmd.lng));
        map.setLevel(Math.max(1, Math.min(14, Math.round(22-cmd.zoom))));
      }
      setTimeout(() => { suppressCameraMessage = false; emitCamera(); }, 80);
    }

    async function searchAddress(address) {
      if (!map) return;
      if (provider === 'google') {
        if (!geocoder) return;
        try {
          const response = await geocoder.geocode({ address });
          const result = response.results && response.results[0];
          if (!result) throw new Error('검색 결과가 없습니다.');
          const location = result.geometry.location;
          map.setCenter(location);
          post({ type:'geocodeResult', lat:location.lat(), lng:location.lng(), formattedAddress:result.formatted_address });
        } catch (error) {
          post({ type:'error', message:`주소 검색 실패: ${error.message || error}` });
        }
      } else if (provider === 'naver') {
        naver.maps.Service.geocode({ query:address }, (status, response) => {
          if (status !== naver.maps.Service.Status.OK || !response.v2 || !response.v2.addresses || !response.v2.addresses.length) {
            post({ type:'error', message:'주소 검색 실패 또는 검색 결과가 없습니다.' });
            return;
          }
          const item = response.v2.addresses[0];
          const lat = Number(item.y);
          const lng = Number(item.x);
          map.setCenter(new naver.maps.LatLng(lat,lng));
          post({ type:'geocodeResult', lat, lng, formattedAddress:item.roadAddress || item.jibunAddress || address });
        });
      } else if (provider === 'kakao') {
        if (!geocoder) return;
        geocoder.addressSearch(address, (result, status) => {
          if (status !== kakao.maps.services.Status.OK || !result || !result.length) {
            post({ type:'error', message:'주소 검색 실패 또는 검색 결과가 없습니다.' });
            return;
          }
          const lat = Number(result[0].y);
          const lng = Number(result[0].x);
          map.setCenter(new kakao.maps.LatLng(lat,lng));
          post({ type:'geocodeResult', lat, lng, formattedAddress:result[0].road_address?.address_name || result[0].address_name || address });
        });
      }
    }

    function setFrame(width, height) {
      if (!width || !height) return;
      frameWidth = width;
      frameHeight = height;
      resizeFrame();
    }

    function resizeFrame() {
      const frame = document.getElementById('frame');
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;
      const targetRatio = frameWidth / frameHeight;
      const viewportRatio = viewportWidth / viewportHeight;
      let width;
      let height;
      if (viewportRatio > targetRatio) {
        height = viewportHeight * 0.92;
        width = height * targetRatio;
      } else {
        width = viewportWidth * 0.92;
        height = width / targetRatio;
      }
      frame.style.width = `${Math.max(1, width)}px`;
      frame.style.height = `${Math.max(1, height)}px`;
    }

    window.addEventListener('resize', resizeFrame);
    window.addEventListener('error', event => {
      if (!event?.message) return;
      post({ type:'diagnostic', provider, origin:currentOrigin(), message:`JavaScript 오류: ${event.message}` });
    });

    window.chrome.webview.addEventListener('message', event => {
      const cmd = event.data;
      if (!cmd || !cmd.type) return;
      if (cmd.type === 'initialize') initialize(cmd);
      else if (cmd.type === 'setCamera') setCamera(cmd);
      else if (cmd.type === 'searchAddress') searchAddress(cmd.address);
      else if (cmd.type === 'setFrame') setFrame(cmd.width, cmd.height);
      else if (cmd.type === 'setFrameVisible') document.getElementById('frame').style.display = cmd.visible ? 'block' : 'none';
    });

    post({ type:'hostReady', origin:currentOrigin() });
  </script>
</body>
</html>
