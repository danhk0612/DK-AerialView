<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#eceff1; }
    #viewport { position:absolute; inset:0; overflow:hidden; background:#eceff1; }
    #map {
      position:absolute;
      left:50%; top:50%;
      width:180%; height:180%;
      transform-origin:center center;
      background:#eceff1;
      will-change:transform;
    }
    #interaction {
      position:absolute;
      inset:0;
      z-index:6;
      cursor:grab;
      touch-action:none;
      user-select:none;
      background:transparent;
    }
    #interaction.dragging { cursor:grabbing; }
    #message {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      font:14px sans-serif; color:#555; pointer-events:none; z-index:20;
      text-align:center; padding:24px; box-sizing:border-box;
    }
    #frame {
      position:absolute;
      left:50%; top:50%;
      transform:translate(-50%,-50%);
      border:2px solid rgba(255,255,255,.95);
      box-shadow:0 0 0 9999px rgba(0,0,0,.32), 0 0 0 1px rgba(0,0,0,.45) inset;
      pointer-events:none;
      z-index:10;
      display:none;
    }
    #searchResults {
      position:absolute;
      top:12px;
      left:12px;
      width:min(430px, calc(100% - 24px));
      max-height:min(520px, calc(100% - 24px));
      display:none;
      z-index:40;
      overflow:hidden;
      background:rgba(255,255,255,.98);
      border:1px solid rgba(0,0,0,.18);
      border-radius:8px;
      box-shadow:0 8px 28px rgba(0,0,0,.24);
      font:13px/1.45 sans-serif;
      color:#222;
    }
    #searchResultsHeader {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:10px 12px;
      border-bottom:1px solid #e2e2e2;
      font-weight:600;
    }
    #searchResultsClose {
      border:0;
      background:transparent;
      cursor:pointer;
      font-size:18px;
      line-height:1;
      padding:2px 5px;
      color:#666;
    }
    #searchResultsList {
      max-height:450px;
      overflow:auto;
    }
    .search-result {
      display:block;
      width:100%;
      border:0;
      border-bottom:1px solid #eee;
      background:#fff;
      text-align:left;
      padding:10px 12px;
      cursor:pointer;
      color:inherit;
    }
    .search-result:last-child { border-bottom:0; }
    .search-result:hover, .search-result:focus { background:#f2f6ff; outline:none; }
    .search-result-name { font-size:14px; font-weight:600; margin-bottom:2px; }
    .search-result-category { color:#777; font-size:12px; margin-bottom:3px; }
    .search-result-address { color:#555; font-size:12px; }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="map"></div>
    <div id="interaction" title="왼쪽 드래그: 이동 / 휠: 미세 줌 / 오른쪽 드래그: 회전"></div>
    <div id="frame"></div>
    <div id="message">Kakao SkyView 초기화 대기 중</div>
    <div id="searchResults">
      <div id="searchResultsHeader">
        <span id="searchResultsTitle">검색 결과</span>
        <button id="searchResultsClose" type="button" aria-label="검색 결과 닫기">×</button>
      </div>
      <div id="searchResultsList"></div>
    </div>
  </div>

  <script>
    let map = null;
    let geocoder = null;
    let places = null;
    let apiKey = '';
    let suppressCameraMessage = false;
    let frameWidth = 16;
    let frameHeight = 9;
    let displayZoom = 18.0;
    let currentHeading = 0.0;
    let currentNativeZoom = 18;
    let sdkLoading = false;

    let pointerMode = null;
    let activePointerId = null;
    let lastPointerX = 0;
    let lastPointerY = 0;

    const post = payload => window.chrome.webview.postMessage(payload);
    const message = text => document.getElementById('message').textContent = text || '';
    const mapNode = () => document.getElementById('map');
    const interactionNode = () => document.getElementById('interaction');
    const currentOrigin = () => window.location.origin;
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    function loadScript(src, onload) {
      const previous = document.getElementById('kakao-maps-script');
      if (previous) previous.remove();
      const script = document.createElement('script');
      script.id = 'kakao-maps-script';
      script.async = true;
      script.defer = true;
      script.src = src;
      script.onload = onload;
      script.onerror = () => {
        const detail = `Kakao 지도 SDK를 불러오지 못했습니다. Kakao Developers의 JavaScript SDK 도메인에 ${currentOrigin()} 를 등록하고 JavaScript Key를 확인하세요.`;
        message(detail);
        post({ type:'error', message:detail, origin:currentOrigin(), reason:'sdk-load' });
      };
      document.head.appendChild(script);
    }

    function getFineScale() {
      return Math.pow(2, displayZoom - Math.floor(displayZoom));
    }

    function applyViewTransform() {
      const scale = getFineScale();
      mapNode().style.transform = `translate(-50%,-50%) rotate(${currentHeading}deg) scale(${scale})`;
    }

    function normalizeHeading(value) {
      return ((Number(value || 0) % 360) + 360) % 360;
    }

    function emitCamera() {
      if (!map || suppressCameraMessage) return;
      const center = map.getCenter();
      post({
        type:'cameraChanged',
        lat:center.getLat(),
        lng:center.getLng(),
        zoom:displayZoom,
        heading:currentHeading
      });
    }

    function setDisplayZoom(value, emit = true) {
      if (!map) return;
      displayZoom = clamp(Number(value || 18), 8, 21.9);
      const nativeZoom = clamp(Math.floor(displayZoom), 8, 21);
      const targetLevel = 22 - nativeZoom;

      if (nativeZoom !== currentNativeZoom || map.getLevel() !== targetLevel) {
        currentNativeZoom = nativeZoom;
        map.setLevel(targetLevel);
      }

      applyViewTransform();
      if (emit) emitCamera();
    }

    function setHeading(value, emit = true) {
      currentHeading = normalizeHeading(value);
      applyViewTransform();
      if (emit) emitCamera();
    }

    function setCenter(lat, lng) {
      if (!map) return;
      map.setCenter(new kakao.maps.LatLng(Number(lat), Number(lng)));
    }

    function panByScreenDelta(screenDx, screenDy) {
      if (!map || (!screenDx && !screenDy)) return;

      const scale = getFineScale();
      const radians = -currentHeading * Math.PI / 180;
      const cos = Math.cos(radians);
      const sin = Math.sin(radians);

      const nativeDx = (screenDx * cos - screenDy * sin) / scale;
      const nativeDy = (screenDx * sin + screenDy * cos) / scale;

      const projection = map.getProjection();
      const centerPoint = new kakao.maps.Point(mapNode().clientWidth / 2, mapNode().clientHeight / 2);
      const nextCenterPoint = new kakao.maps.Point(
        centerPoint.x - nativeDx,
        centerPoint.y - nativeDy
      );
      const nextCenter = projection.coordsFromContainerPoint(nextCenterPoint);
      if (nextCenter) map.setCenter(nextCenter);
    }

    function initializeInteraction() {
      const node = interactionNode();

      node.addEventListener('contextmenu', event => event.preventDefault());

      node.addEventListener('pointerdown', event => {
        if (!map || (event.button !== 0 && event.button !== 2)) return;
        pointerMode = event.button === 2 ? 'rotate' : 'pan';
        activePointerId = event.pointerId;
        lastPointerX = event.clientX;
        lastPointerY = event.clientY;
        node.setPointerCapture(event.pointerId);
        node.classList.add('dragging');
        event.preventDefault();
      });

      node.addEventListener('pointermove', event => {
        if (!map || pointerMode === null || event.pointerId !== activePointerId) return;
        const dx = event.clientX - lastPointerX;
        const dy = event.clientY - lastPointerY;
        lastPointerX = event.clientX;
        lastPointerY = event.clientY;

        if (pointerMode === 'pan') {
          panByScreenDelta(dx, dy);
        } else {
          setHeading(currentHeading + dx * 0.45, true);
        }
        event.preventDefault();
      });

      const finishPointer = event => {
        if (event.pointerId !== activePointerId) return;
        if (node.hasPointerCapture(event.pointerId)) node.releasePointerCapture(event.pointerId);
        pointerMode = null;
        activePointerId = null;
        node.classList.remove('dragging');
        emitCamera();
      };
      node.addEventListener('pointerup', finishPointer);
      node.addEventListener('pointercancel', finishPointer);

      node.addEventListener('wheel', event => {
        if (!map) return;
        const direction = event.deltaY < 0 ? 1 : -1;
        setDisplayZoom(Math.round((displayZoom + direction * 0.1) * 10) / 10, true);
        event.preventDefault();
      }, { passive:false });
    }

    function initialize(cmd) {
      apiKey = cmd.kakaoJavaScriptKey || '';
      if (!apiKey) {
        message('설정에서 Kakao JavaScript Key를 입력하세요.');
        post({ type:'error', message:'Kakao JavaScript Key가 설정되지 않았습니다.' });
        return;
      }

      if (sdkLoading) return;
      sdkLoading = true;
      message('Kakao SkyView 초기화 중...');

      const start = () => kakao.maps.load(() => {
        try {
          map = new kakao.maps.Map(mapNode(), {
            center:new kakao.maps.LatLng(37.5665,126.9780),
            level:4,
            mapTypeId:kakao.maps.MapTypeId.SKYVIEW,
            draggable:false,
            scrollwheel:false,
            disableDoubleClick:true
          });
          map.setMapTypeId(kakao.maps.MapTypeId.SKYVIEW);
          map.setDraggable(false);
          map.setZoomable(false);
          geocoder = new kakao.maps.services.Geocoder();
          places = new kakao.maps.services.Places(map);
          currentNativeZoom = 18;
          displayZoom = 18.0;
          currentHeading = 0.0;
          applyViewTransform();

          kakao.maps.event.addListener(map, 'center_changed', emitCamera);
          kakao.maps.event.addListener(map, 'tilesloaded', () => message(''));

          sdkLoading = false;
          message('');
          resizeFrame();
          document.getElementById('frame').style.display = 'block';
          post({
            type:'ready',
            provider:'kakao',
            capabilities:{ zoom:true, heading:true, geocode:true, placeSearch:true, satellite:true },
            origin:currentOrigin()
          });
          emitCamera();
        } catch (error) {
          sdkLoading = false;
          const detail = `Kakao 지도 초기화 실패: ${error?.message || error}`;
          message(detail);
          post({ type:'error', message:detail, reason:'map-init' });
        }
      });

      if (window.kakao?.maps) {
        start();
      } else {
        loadScript(
          `https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey=${encodeURIComponent(apiKey)}&libraries=services`,
          start
        );
      }
    }

    function setCamera(cmd) {
      if (!map) return;
      suppressCameraMessage = true;
      setCenter(cmd.lat, cmd.lng);
      setDisplayZoom(cmd.zoom, false);
      setHeading(cmd.heading, false);
      setTimeout(() => {
        suppressCameraMessage = false;
        emitCamera();
      }, 80);
    }

    function hideSearchResults() {
      const panel = document.getElementById('searchResults');
      const list = document.getElementById('searchResultsList');
      panel.style.display = 'none';
      list.replaceChildren();
    }

    function resolvePlace(place, originalQuery) {
      const lat = Number(place.y);
      const lng = Number(place.x);
      const address = place.road_address_name || place.address_name || '';
      hideSearchResults();
      setCenter(lat, lng);
      post({
        type:'geocodeResult',
        lat,
        lng,
        formattedAddress:address ? `${place.place_name} · ${address}` : place.place_name || originalQuery,
        placeName:place.place_name || '',
        searchKind:'place'
      });
    }

    function showSearchResults(query, results) {
      const panel = document.getElementById('searchResults');
      const title = document.getElementById('searchResultsTitle');
      const list = document.getElementById('searchResultsList');
      list.replaceChildren();
      title.textContent = `'${query}' 검색 결과 ${Math.min(results.length, 10)}건`;

      results.slice(0, 10).forEach(place => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'search-result';

        const name = document.createElement('div');
        name.className = 'search-result-name';
        name.textContent = place.place_name || '(이름 없음)';

        const category = document.createElement('div');
        category.className = 'search-result-category';
        category.textContent = place.category_name || '';

        const address = document.createElement('div');
        address.className = 'search-result-address';
        address.textContent = place.road_address_name || place.address_name || '';

        button.append(name, category, address);
        button.addEventListener('click', () => resolvePlace(place, query));
        list.appendChild(button);
      });

      panel.style.display = 'block';
    }

    function searchPlace(query) {
      if (!places) {
        post({ type:'diagnostic', message:'장소 검색 서비스를 아직 사용할 수 없습니다.' });
        return;
      }

      const center = map.getCenter();
      places.keywordSearch(query, (result, status) => {
        if (status !== kakao.maps.services.Status.OK || !result || !result.length) {
          hideSearchResults();
          post({ type:'diagnostic', message:`'${query}' 검색 결과가 없습니다.` });
          return;
        }

        if (result.length === 1) {
          resolvePlace(result[0], query);
          return;
        }

        showSearchResults(query, result);
        post({ type:'diagnostic', message:`'${query}' 장소 검색 결과 ${result.length}건 · 지도에서 선택하세요.` });
      }, { location:center });
    }

    function searchAddress(query) {
      if (!map || !geocoder || !query) return;
      const normalizedQuery = String(query).trim();
      if (!normalizedQuery) return;

      hideSearchResults();
      geocoder.addressSearch(normalizedQuery, (result, status) => {
        if (status === kakao.maps.services.Status.OK && result && result.length) {
          const lat = Number(result[0].y);
          const lng = Number(result[0].x);
          setCenter(lat, lng);
          post({
            type:'geocodeResult',
            lat,
            lng,
            formattedAddress:result[0].road_address?.address_name || result[0].address_name || normalizedQuery,
            searchKind:'address'
          });
          return;
        }

        searchPlace(normalizedQuery);
      });
    }

    function setFrame(width, height) {
      if (!width || !height) return;
      frameWidth = width;
      frameHeight = height;
      resizeFrame();
    }

    function resizeFrame() {
      const frame = document.getElementById('frame');
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;
      const targetRatio = frameWidth / frameHeight;
      const viewportRatio = viewportWidth / viewportHeight;
      let width;
      let height;
      if (viewportRatio > targetRatio) {
        height = viewportHeight * 0.92;
        width = height * targetRatio;
      } else {
        width = viewportWidth * 0.92;
        height = width / targetRatio;
      }
      frame.style.width = `${Math.max(1, width)}px`;
      frame.style.height = `${Math.max(1, height)}px`;
    }

    window.dkAerialViewGetCenter = () => {
      if (!map) return null;
      const center = map.getCenter();
      return {
        lat:Number(center.getLat()),
        lng:Number(center.getLng()),
        zoom:Number(displayZoom),
        heading:Number(currentHeading)
      };
    };

    document.getElementById('searchResultsClose').addEventListener('click', hideSearchResults);

    window.addEventListener('resize', () => {
      resizeFrame();
      if (map) map.relayout();
    });

    window.addEventListener('error', event => {
      if (!event?.message) return;
      post({ type:'diagnostic', message:`JavaScript 오류: ${event.message}` });
    });

    window.chrome.webview.addEventListener('message', event => {
      const cmd = event.data;
      if (!cmd?.type) return;
      if (cmd.type === 'initialize') initialize(cmd);
      else if (cmd.type === 'setCamera') setCamera(cmd);
      else if (cmd.type === 'searchAddress') searchAddress(cmd.address);
      else if (cmd.type === 'setFrame') setFrame(cmd.width, cmd.height);
      else if (cmd.type === 'setFrameVisible') document.getElementById('frame').style.display = cmd.visible ? 'block' : 'none';
    });

    initializeInteraction();
    post({ type:'hostReady', origin:currentOrigin() });
  </script>
</body>
</html>
