<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html, body, #roadview { width:100%; height:100%; margin:0; overflow:hidden; background:#111; }
    #message { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:10; pointer-events:none; color:#fff; background:rgba(0,0,0,.35); font:14px sans-serif; text-align:center; }
  </style>
</head>
<body>
  <div id="roadview"></div>
  <div id="message">카카오 로드뷰 초기화 대기 중</div>
  <script>
    let roadview = null;
    let roadviewClient = null;
    let apiKey = '';
    let sdkLoading = false;
    let sdkWaiters = [];

    const post = payload => window.chrome.webview.postMessage(payload);
    const message = text => document.getElementById('message').textContent = text || '';
    const currentOrigin = () => window.location.origin;
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    function finishSdkLoad() {
      if (!window.kakao?.maps) {
        sdkLoading = false;
        post({ type:'roadviewError', message:'Kakao Roadview SDK 초기화에 실패했습니다.' });
        return;
      }
      kakao.maps.load(() => {
        sdkLoading = false;
        const waiters = sdkWaiters.splice(0);
        waiters.forEach(fn => fn());
      });
    }

    function ensureKakaoSdk(callback) {
      if (window.kakao?.maps) {
        kakao.maps.load(callback);
        return;
      }
      sdkWaiters.push(callback);
      if (sdkLoading) return;
      sdkLoading = true;

      const script = document.createElement('script');
      script.async = true;
      script.defer = true;
      script.src = `https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey=${encodeURIComponent(apiKey)}`;
      script.onload = finishSdkLoad;
      script.onerror = () => {
        sdkLoading = false;
        post({ type:'roadviewError', message:'Kakao Roadview SDK를 불러오지 못했습니다.' });
      };
      document.head.appendChild(script);
    }

    function ensureClient() {
      if (!roadviewClient) roadviewClient = new kakao.maps.RoadviewClient();
      return roadviewClient;
    }

    function bearingDegrees(fromLat, fromLng, toLat, toLng) {
      const d2r = Math.PI / 180;
      const p1 = fromLat * d2r;
      const p2 = toLat * d2r;
      const dl = (toLng - fromLng) * d2r;
      const y = Math.sin(dl) * Math.cos(p2);
      const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function angularDifference(a, b) {
      const d = Math.abs((((Number(a) - Number(b)) % 360) + 540) % 360 - 180);
      return d;
    }

    function samePosition(a, b, epsilon = 0.0000005) {
      if (!a || !b) return false;
      return Math.abs(Number(a.lat) - Number(b.lat)) <= epsilon &&
             Math.abs(Number(a.lng) - Number(b.lng)) <= epsilon;
    }

    function readPosition() {
      try {
        const pos = roadview?.getPosition?.();
        if (!pos) return null;
        return { lat:Number(pos.getLat()), lng:Number(pos.getLng()) };
      } catch (_) {
        return null;
      }
    }

    function probe(cmd) {
      if (!apiKey) {
        post({ type:'panoProbeResult', requestId:cmd.requestId, panoId:0 });
        return;
      }

      ensureKakaoSdk(() => {
        try {
          const client = ensureClient();
          const searchPosition = new kakao.maps.LatLng(Number(cmd.searchLat), Number(cmd.searchLng));
          client.getNearestPanoId(searchPosition, Number(cmd.radius || 100), panoId => {
            post({
              type:'panoProbeResult',
              requestId:cmd.requestId,
              panoId:Number(panoId || 0)
            });
          });
        } catch (error) {
          post({ type:'panoProbeResult', requestId:cmd.requestId, panoId:0, message:error?.message || String(error) });
        }
      });
    }

    async function waitForPanoAndPosition(targetPanoId, previousPanoId, previousPosition, timeoutMs = 8000) {
      let panoChanged = Number(previousPanoId || 0) !== Number(targetPanoId);
      let positionChanged = !previousPosition;
      let eventPositionChanged = false;

      const onPanoChanged = () => {
        try {
          panoChanged = Number(roadview?.getPanoId?.() || 0) === Number(targetPanoId);
        } catch (_) {
        }
      };
      const onPositionChanged = () => { eventPositionChanged = true; };

      kakao.maps.event.addListener(roadview, 'panoid_changed', onPanoChanged);
      kakao.maps.event.addListener(roadview, 'position_changed', onPositionChanged);

      try {
        const started = Date.now();
        let stableSamples = 0;
        let lastPosition = null;

        while (Date.now() - started < timeoutMs) {
          let currentPanoId = 0;
          try { currentPanoId = Number(roadview?.getPanoId?.() || 0); } catch (_) {}
          const currentPosition = readPosition();

          if (currentPanoId === Number(targetPanoId)) panoChanged = true;
          if (currentPosition && (!previousPosition || !samePosition(currentPosition, previousPosition) || eventPositionChanged)) {
            positionChanged = true;
          }

          if (panoChanged && positionChanged && currentPosition) {
            if (lastPosition && samePosition(currentPosition, lastPosition, 0.0000001)) {
              stableSamples++;
            } else {
              stableSamples = 0;
            }
            lastPosition = currentPosition;

            if (stableSamples >= 2) {
              return { panoId:currentPanoId, position:currentPosition };
            }
          }

          await sleep(100);
        }
        return null;
      } finally {
        kakao.maps.event.removeListener(roadview, 'panoid_changed', onPanoChanged);
        kakao.maps.event.removeListener(roadview, 'position_changed', onPositionChanged);
      }
    }

    async function applyAndVerifyViewpoint(pan, tilt, zoom) {
      const target = new kakao.maps.Viewpoint(Number(pan), Number(tilt || 0), Number(zoom || 0));
      roadview.setViewpoint(target);
      await sleep(180);

      try {
        const actual = roadview.getViewpoint();
        if (!actual || angularDifference(actual.pan, pan) > 1.0 || Math.abs(Number(actual.tilt) - Number(tilt || 0)) > 1.0) {
          roadview.setViewpoint(target);
          await sleep(180);
        }
      } catch (_) {
        roadview.setViewpoint(target);
        await sleep(180);
      }
    }

    function render(cmd) {
      if (!apiKey) {
        post({ type:'roadviewError', requestId:cmd.requestId, message:'Kakao JavaScript Key가 설정되지 않았습니다.' });
        return;
      }

      message('카카오 로드뷰 렌더링 중...');
      ensureKakaoSdk(async () => {
        try {
          const container = document.getElementById('roadview');
          if (!roadview) roadview = new kakao.maps.Roadview(container, { pan:0, tilt:0, zoom:0 });
          roadview.relayout();

          const searchPosition = new kakao.maps.LatLng(Number(cmd.searchLat), Number(cmd.searchLng));
          const panoId = Number(cmd.panoId || 0);
          if (!panoId) {
            post({ type:'roadviewNotFound', requestId:cmd.requestId });
            return;
          }

          let previousPanoId = 0;
          try { previousPanoId = Number(roadview.getPanoId() || 0); } catch (_) {}
          const previousPosition = readPosition();

          roadview.setPanoId(panoId, searchPosition);

          const ready = await waitForPanoAndPosition(panoId, previousPanoId, previousPosition);
          if (!ready) {
            post({
              type:'roadviewError',
              requestId:cmd.requestId,
              message:`pano ${panoId}의 위치 전환 완료를 확인하지 못했습니다.`
            });
            return;
          }

          // Read the final roadview position only after both pano and position have settled.
          const settledPosition = readPosition() || ready.position;
          const targetLat = Number(cmd.targetLat);
          const targetLng = Number(cmd.targetLng);
          const pan = bearingDegrees(settledPosition.lat, settledPosition.lng, targetLat, targetLng);

          await applyAndVerifyViewpoint(pan, Number(cmd.tilt || 0), Number(cmd.zoom || 0));

          // Give imagery tiles a brief settle period after viewpoint adjustment.
          await sleep(450);
          const actualViewpoint = (() => {
            try { return roadview.getViewpoint(); } catch (_) { return null; }
          })();

          message('');
          post({
            type:'roadviewReady',
            requestId:cmd.requestId,
            panoId:ready.panoId,
            pan,
            actualPan:actualViewpoint ? Number(actualViewpoint.pan) : pan,
            lat:settledPosition.lat,
            lng:settledPosition.lng,
            targetLat,
            targetLng
          });
        } catch (error) {
          post({ type:'roadviewError', requestId:cmd.requestId, message:error?.message || String(error) });
        }
      });
    }

    window.chrome.webview.addEventListener('message', event => {
      const cmd = event.data;
      if (!cmd?.type) return;
      if (cmd.type === 'initializeRoadview') {
        apiKey = cmd.kakaoJavaScriptKey || '';
        post({ type:'roadviewHostReady', origin:currentOrigin() });
      } else if (cmd.type === 'probeRoadview') {
        probe(cmd);
      } else if (cmd.type === 'renderRoadview') {
        render(cmd);
      }
    });

    post({ type:'roadviewHostLoaded', origin:currentOrigin() });
  </script>
</body>
</html>
